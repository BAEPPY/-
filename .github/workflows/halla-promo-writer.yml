# 한라초 홍보글 작성 — 데스크톱 앱 설치 파일 만들기
#
# 언제 실행되나
#   - halla-promo-writer/ 안의 파일이 바뀌어 푸시되면 자동으로 (Actions 탭 > 해당 실행 > Artifacts 에서 내려받기)
#   - promo-v1.0.0 같은 태그를 푸시하면 빌드 후 Releases 페이지에 설치 파일 업로드
#   - 기본 브랜치에 이 파일이 있으면 Actions 탭에서 "Run workflow" 로 수동 실행도 가능
name: 한라초 홍보글 작성 앱 빌드

on:
  push:
    branches:
      - '**'
    paths:
      - 'halla-promo-writer/**'
      - '.github/workflows/halla-promo-writer.yml'
    tags:
      - 'promo-v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '만들 운영체제'
        type: choice
        default: windows
        options:
          - windows
          - mac
          - both

defaults:
  run:
    working-directory: halla-promo-writer

jobs:
  windows:
    name: Windows 설치 파일
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms != 'mac' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: halla-promo-writer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: halla-promo-writer/dist/*.exe
          if-no-files-found: error

  mac:
    name: macOS 설치 파일
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms != 'windows' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: halla-promo-writer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: halla-promo-writer/dist/*.dmg
          if-no-files-found: error

  release:
    name: Releases 에 올리기
    if: ${{ startsWith(github.ref, 'refs/tags/promo-v') }}
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: 릴리스 만들기
        working-directory: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "한라초 홍보글 작성 ${GITHUB_REF_NAME#promo-v}" \
            --notes "Windows: *-win-x64.exe(설치판) 또는 *-무설치.exe / macOS: *.dmg" \
            *.exe *.dmg
